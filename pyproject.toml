[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmala-research"
version = "0.1.0"
description = "Auditable residual-memory gated linear attention research prototype"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
gpu = ["flash-linear-attention"]
ann = ["hnswlib>=0.8"]

[tool.setuptools.packages.find]
include = ["rmala*"]
